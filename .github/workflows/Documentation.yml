name: Documentation

on:
  push:
    branches:
      - main
      - 'release-'
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    uses: "SciML/.github/.github/workflows/documentation.yml@v1"
    with:
      debug-documenter: true
    secrets: "inherit"
